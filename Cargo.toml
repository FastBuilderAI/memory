[package]
name = "fastmemory"
version = "0.4.2"
edition = "2021"
description = "A Topology Ontological Clustering Engine for AI Agent Memory"
license = "MIT"
repository = "https://github.com/FastBuilderAI/memory"
homepage = "https://fastbuilder.ai"
exclude = ["example/*", "scripts/*", "bin/*", "*.png", "*.md", "!README.md"]

[lib]
name = "fastmemory"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fastmemory"
path = "src/main.rs"
required-features = ["cli"]

[features]
# The CLI/server (and its license telemetry) are on by default, as before. Embedding crates that need only the parser
# and clustering use `default-features = false`: no network code, no async runtime.
default = ["cli"]
cli = ["dep:clap", "dep:tokio", "dep:axum", "telemetry"]
telemetry = ["dep:reqwest", "dep:sysinfo", "dep:dotenv"]
python = ["pyo3/extension-module", "telemetry"]

[dependencies]
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
pyo3 = { version = "0.28.2", optional = true }
clap = { version = "4.5.4", features = ["derive"], optional = true }
tokio = { version = "1.37.0", features = ["full", "rt-multi-thread"], optional = true }
axum = { version = "0.7.5", optional = true }
reqwest = { version = "0.13.2", features = ["json", "rustls", "blocking"], optional = true }
sysinfo = { version = "0.38.4", optional = true }
dotenv = { version = "0.15.0", optional = true }
libloading = "0.8"
